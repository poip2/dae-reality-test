name: Build dae REALITY version test
run-name: Build dae REALITY 26.3.27 (${{ github.event_name }})

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-dae-reality-test.yml"
      - "patches/reality-version-26.3.27.patch"
      - "scripts/verify-reality-version.sh"
      - "README.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag
        required: true
        default: reality-test-26.3.27
        type: string

permissions:
  contents: write

concurrency:
  group: dae-reality-26.3.27-${{ github.ref }}
  cancel-in-progress: false

env:
  DAE_COMMIT: 5a51cc747ef9e17185d438dc54ebf32c681984db
  OUTBOUND_COMMIT: cc1a217490f9725953dce65f703b0c2f12dd8b2f
  OUTBOUND_VERSION: v0.0.0-sticky-ip.0.20260401154811-cc1a217490f9
  BINARY_NAME: dae-reality-26.3.27-arm64
  BUILD_VERSION: 2026.06.14-5a51cc747ef9e17185d438dc54ebf32c681984db-reality-test-26.3.27

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout exact dae source
        uses: actions/checkout@v4
        with:
          repository: daeuniverse/dae
          ref: 5a51cc747ef9e17185d438dc54ebf32c681984db
          path: source/dae
          fetch-depth: 1
          submodules: recursive

      - name: Checkout exact outbound source
        uses: actions/checkout@v4
        with:
          repository: daeuniverse/outbound
          ref: cc1a217490f9725953dce65f703b0c2f12dd8b2f
          path: source/outbound
          fetch-depth: 1

      - name: Verify immutable baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source/dae rev-parse HEAD)" = "$DAE_COMMIT"
          test "$(git -C source/outbound rev-parse HEAD)" = "$OUTBOUND_COMMIT"
          test "$(head -n 1 source/outbound/go.mod)" = "module github.com/daeuniverse/outbound"
          grep -Fqx $'\tgithub.com/daeuniverse/outbound '"$OUTBOUND_VERSION" source/dae/go.mod
          grep -Fqx 'replace github.com/daeuniverse/outbound => github.com/olicesx/outbound v0.0.0-sticky-ip.0.20260518034804-52c26f8e759e' source/dae/go.mod
          echo "dae:      $(git -C source/dae rev-parse HEAD)"
          echo "outbound: $(git -C source/outbound rev-parse HEAD)"

      - name: Verify and apply single-variable patch
        shell: bash
        run: |
          set -euo pipefail
          reality=source/outbound/transport/tls/reality.go
          patch_file="$GITHUB_WORKSPACE/patches/reality-version-26.3.27.patch"

          scripts/verify-reality-version.sh "$reality" 1 8 10
          git -C source/outbound apply --check "$patch_file"
          git -C source/outbound apply "$patch_file"
          scripts/verify-reality-version.sh "$reality" 26 3 27

          test "$(git -C source/outbound diff --name-only)" = "transport/tls/reality.go"
          test "$(git -C source/outbound diff --numstat)" = $'3\t3\ttransport/tls/reality.go'
          git -C source/outbound diff --check
          diff -u "$patch_file" <(git -C source/outbound diff --unified=1 -- transport/tls/reality.go)
          git -C source/outbound diff --unified=1 -- transport/tls/reality.go

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false

      - name: Install official build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-15 llvm-15 file binutils

      - name: Point dae at patched local outbound
        shell: bash
        working-directory: source/dae
        run: |
          set -euo pipefail
          go mod edit -replace=github.com/daeuniverse/outbound="$GITHUB_WORKSPACE/source/outbound"
          grep -Fqx "replace github.com/daeuniverse/outbound => $GITHUB_WORKSPACE/source/outbound" go.mod
          grep -Fqx $'\tgithub.com/daeuniverse/outbound '"$OUTBOUND_VERSION" go.mod
          test "$(git diff --name-only)" = "go.mod"
          git diff --check
          git diff -- go.mod
          git diff -- go.mod > "$RUNNER_TEMP/expected-dae-go-mod.patch"

      - name: Download locked dependencies
        shell: bash
        working-directory: source/dae
        run: |
          set -euo pipefail
          export GOMODCACHE="$PWD/go-mod"
          export GOFLAGS="-mod=readonly -modcacherw"
          go mod download
          test "$(git diff --name-only)" = "go.mod"

      - name: Build ARM64 binary with official Makefile
        shell: bash
        working-directory: source/dae
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          export GOOS=linux
          export GOARCH=arm64
          export CGO_ENABLED=0
          export GOMODCACHE="$PWD/go-mod"
          export GOFLAGS="-trimpath -mod=readonly -modcacherw"
          export GOEXPERIMENT="newinliner,simd,heapminimum512kib,randomizedheapbase64"
          export OUTPUT="$GITHUB_WORKSPACE/dist/$BINARY_NAME"
          export VERSION="$BUILD_VERSION"
          export CLANG=clang-15
          export STRIP=llvm-strip-15
          make CC=clang

          diff -u "$RUNNER_TEMP/expected-dae-go-mod.patch" <(git diff -- go.mod)
          test "$(git diff --name-only)" = "go.mod"
          test "$(git -C ../outbound diff --name-only)" = "transport/tls/reality.go"
          scripts="$GITHUB_WORKSPACE/scripts/verify-reality-version.sh"
          "$scripts" ../outbound/transport/tls/reality.go 26 3 27

      - name: Verify ARM64 artifact and provenance
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/$BINARY_NAME"
          file "$binary" | tee "$RUNNER_TEMP/file.txt"
          grep -Eq 'ELF 64-bit.*ARM aarch64' "$RUNNER_TEMP/file.txt"
          ls -lh "$binary"
          sha256sum "$binary"
          go version -m "$binary" | tee "$RUNNER_TEMP/go-version-m.txt"
          grep -F "github.com/daeuniverse/outbound" "$RUNNER_TEMP/go-version-m.txt"
          grep -F "$GITHUB_WORKSPACE/source/outbound" "$RUNNER_TEMP/go-version-m.txt"
          grep -F "vcs.revision=$DAE_COMMIT" "$RUNNER_TEMP/go-version-m.txt"

          echo "Patched outbound checkout: $(git -C source/outbound rev-parse HEAD)"
          sha256sum source/outbound/transport/tls/reality.go patches/reality-version-26.3.27.patch
          strings "$binary" > "$RUNNER_TEMP/binary-strings.txt"
          grep -F "$BUILD_VERSION" "$RUNNER_TEMP/binary-strings.txt"
          echo "Embedded build identifier verified; REALITY bytes are verified from audited source patch, not strings."

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          cp patches/reality-version-26.3.27.patch dist/
          (
            cd dist
            sha256sum "$BINARY_NAME" reality-version-26.3.27.patch > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: dae-reality-26.3.27-arm64
          path: |
            dist/dae-reality-26.3.27-arm64
            dist/SHA256SUMS
            dist/reality-version-26.3.27.patch
          retention-days: 14
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: dae REALITY client version 26.3.27 test
          prerelease: true
          generate_release_notes: false
          body: |
            Experimental, unofficial dae build for one-variable REALITY compatibility testing.
            Baselines: dae 5a51cc747ef9e17185d438dc54ebf32c681984db; outbound cc1a217490f9725953dce65f703b0c2f12dd8b2f.
            Only outbound source change: REALITY client version bytes 1.8.10 -> 26.3.27.
            Build success does not establish root cause.
          files: |
            dist/dae-reality-26.3.27-arm64
            dist/SHA256SUMS
            dist/reality-version-26.3.27.patch
          fail_on_unmatched_files: true
