name: Build JP3 REALITY gRPC handoff probe
run-name: Build JP3 REALITY gRPC handoff probe (${{ github.event_name }})

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-jp3-reality-grpc-handoff-probe.yml"
      - "patches/jp3-reality-grpc-handoff-probe-6.patch"
      - "scripts/verify-reality-version.sh"
      - "README.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag
        required: true
        default: jp3-reality-grpc-handoff-probe-6
        type: string

permissions:
  contents: write

concurrency:
  group: jp3-reality-grpc-handoff-probe-6-${{ github.ref }}
  cancel-in-progress: false

env:
  DAE_COMMIT: 5a51cc747ef9e17185d438dc54ebf32c681984db
  OUTBOUND_COMMIT: 52c26f8e759e156d2f5ec97d18590febf74ba8bb
  OUTBOUND_VERSION: v0.0.0-sticky-ip.0.20260518034804-52c26f8e759e
  OUTBOUND_REQUIRED_VERSION: v0.0.0-sticky-ip.0.20260401154811-cc1a217490f9
  BINARY_NAME: dae-jp3-reality-grpc-handoff-probe-arm64
  BUILD_VERSION: 2026.06.14-5a51cc747ef9e17185d438dc54ebf32c681984db-jp3-reality-grpc-handoff-probe-6

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout exact dae source
        uses: actions/checkout@v4
        with:
          repository: daeuniverse/dae
          ref: 5a51cc747ef9e17185d438dc54ebf32c681984db
          path: source/dae
          fetch-depth: 1
          submodules: recursive

      - name: Checkout exact effective outbound source
        uses: actions/checkout@v4
        with:
          repository: olicesx/outbound
          ref: 52c26f8e759e156d2f5ec97d18590febf74ba8bb
          path: source/outbound
          fetch-depth: 1

      - name: Verify immutable clean baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source/dae rev-parse HEAD)" = "$DAE_COMMIT"
          test "$(git -C source/outbound rev-parse HEAD)" = "$OUTBOUND_COMMIT"
          test "$(head -n 1 source/outbound/go.mod)" = "module github.com/daeuniverse/outbound"
          grep -Fqx $'\tgithub.com/daeuniverse/outbound '"$OUTBOUND_REQUIRED_VERSION" source/dae/go.mod
          grep -Fqx "replace github.com/daeuniverse/outbound => github.com/olicesx/outbound $OUTBOUND_VERSION" source/dae/go.mod
          scripts/verify-reality-version.sh source/outbound/transport/tls/reality.go 1 8 10
          test ! -e source/outbound/pkg/jp3diag/jp3diag.go
          test -z "$(git -C source/dae status --porcelain)"
          test -z "$(git -C source/outbound status --porcelain)"
          echo "dae:      $(git -C source/dae rev-parse HEAD)"
          echo "outbound: $(git -C source/outbound rev-parse HEAD)"

      - name: Apply and audit REALITY gRPC handoff probe
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/patches/jp3-reality-grpc-handoff-probe-6.patch"
          outbound="$GITHUB_WORKSPACE/source/outbound"

          git -C "$outbound" apply --check --unidiff-zero "$patch_file"
          git -C "$outbound" apply --unidiff-zero "$patch_file"
          git -C "$outbound" add -N dialer/v2ray/v2ray_test.go pkg/jp3diag/jp3diag.go

          scripts/verify-reality-version.sh "$outbound/transport/tls/reality.go" 26 3 27
          test "$(git -C "$outbound" diff --name-only)" = "$(printf '%s\n' \
            dialer/v2ray/v2ray.go \
            dialer/v2ray/v2ray_test.go \
            pkg/jp3diag/jp3diag.go \
            protocol/vless/conn.go \
            transport/grpc/grpc_client.go \
            transport/grpc/grpc_client_test.go \
            transport/tls/reality.go \
            transport/tls/reality_test.go)"
          git -C "$outbound" diff --check
          diff -u "$patch_file" <(git -C "$outbound" diff --unified=0 --binary)

          grep -Fq 'realityDialer.SetNextProtos([]string{"h2"})' "$outbound/dialer/v2ray/v2ray.go"
          grep -Fq 'Presecured:    presecured' "$outbound/dialer/v2ray/v2ray.go"
          grep -Fq 'insecure.NewCredentials()' "$outbound/transport/grpc/grpc_client.go"
          grep -Fq 'REALITY/uTLS via context dialer' "$outbound/transport/grpc/grpc_client.go"
          grep -Fq 'handshake_success verified=true' "$outbound/transport/tls/reality.go"
          grep -Fq 'wire_selfcheck=%t' "$outbound/transport/tls/reality.go"
          grep -Fq 'public_pki_fallback' "$outbound/transport/tls/reality.go"
          grep -Fq 'DAE_JP3_REALITY_PROBE_VERSION' "$outbound/transport/tls/reality.go"
          grep -Fq 'case "1.8.1":' "$outbound/transport/tls/reality.go"
          grep -Fq 'realityClientVersion{1, 8, 1}' "$outbound/transport/tls/reality.go"
          grep -Fq 'allowed values are 1.8.1, 1.8.10, and 26.3.27' "$outbound/transport/tls/reality.go"
          grep -Fq 'applyRealitySingBoxKeyShareFilter(uConn.UConn)' "$outbound/transport/tls/reality.go"
          grep -Fq 'curveID == utls.X25519MLKEM768' "$outbound/transport/tls/reality.go"
          grep -Fq 'share.Group == utls.X25519MLKEM768' "$outbound/transport/tls/reality.go"
          grep -Fq 'reference=%q hybrid_group=%q' "$outbound/transport/tls/reality.go"
          grep -Fq 'TestApplyRealitySingBoxKeyShareFilter' "$outbound/transport/tls/reality_test.go"
          grep -Fq 'TestRealityAuthenticatedAADMatchesFinalRemarshal' "$outbound/transport/tls/reality_test.go"
          grep -Fq 'func realityOfferedNextProtos(diagnostic bool' "$outbound/transport/tls/reality.go"
          grep -Fq 'offered = append(offered, "http/1.1")' "$outbound/transport/tls/reality.go"
          grep -Fq 'applyRealityNextProtos(uConn.UConn, offeredNextProtos)' "$outbound/transport/tls/reality.go"
          grep -Fq 'realityNegotiatedNextProtoMatches(state.NegotiatedProtocol, x.nextProtos)' "$outbound/transport/tls/reality.go"
          grep -Fq 'alpn_observed verified=true' "$outbound/transport/tls/reality.go"
          grep -Fq 'enforcement=%q' "$outbound/transport/tls/reality.go"
          grep -Fq '"application_transport"' "$outbound/transport/tls/reality.go"
          grep -Fq 'TestRealityOfferedNextProtosJP3GRPCControl' "$outbound/transport/tls/reality_test.go"
          grep -Fq 'TestRealityOfferedNextProtosDoesNotChangeOtherTargets' "$outbound/transport/tls/reality_test.go"
          grep -Fq 'TestRealityNegotiatedNextProtoMatches' "$outbound/transport/tls/reality_test.go"
          grep -Fq 'clientconn_obtained' "$outbound/transport/grpc/grpc_client.go"
          grep -Fq 'tun_stream_created' "$outbound/transport/grpc/grpc_client.go"
          grep -Fq 'first_send_result' "$outbound/transport/grpc/grpc_client.go"
          grep -Fq 'first_recv_result' "$outbound/transport/grpc/grpc_client.go"
          grep -Fq 'response_header_ok' "$outbound/protocol/vless/conn.go"
          if grep -Fq 'if !realityNegotiatedNextProto' "$outbound/transport/tls/reality.go"; then
            echo "post-REALITY ALPN hard gate remains" >&2
            exit 1
          fi
          if grep -Fq 'REALITY: unexpected negotiated ALPN' "$outbound/transport/tls/reality.go"; then
            echo "post-REALITY ALPN hard-fail error remains" >&2
            exit 1
          fi
          if grep -R -Fq 'handshake_not_used' "$outbound/dialer/v2ray" "$outbound/transport/grpc"; then
            echo "stale handshake_not_used marker found" >&2
            exit 1
          fi
          if grep -Ei 'jp3diag\.Printf.*(uuid|shortid|authkey|publickey|private|password|subscription|pbk|sid)' \
            "$outbound/transport/tls/reality.go" \
            "$outbound/transport/grpc/grpc_client.go" \
            "$outbound/protocol/vless/conn.go"; then
            echo "diagnostic log references authentication material" >&2
            exit 1
          fi
          git -C "$outbound" diff --stat
          echo "Audited probe: verified REALITY returns its authenticated connection; ALPN remains observable while gRPC proves application readiness."

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false

      - name: Install official build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-15 llvm-15 file binutils

      - name: Test changed outbound packages
        shell: bash
        working-directory: source/outbound
        run: |
          set -euo pipefail
          export GOFLAGS="-mod=readonly"
          gofmt -d \
            dialer/v2ray/v2ray.go \
            dialer/v2ray/v2ray_test.go \
            pkg/jp3diag/jp3diag.go \
            protocol/vless/conn.go \
            transport/grpc/grpc_client.go \
            transport/grpc/grpc_client_test.go \
            transport/tls/reality.go \
            transport/tls/reality_test.go | tee "$RUNNER_TEMP/gofmt.diff"
          test ! -s "$RUNNER_TEMP/gofmt.diff"
          go test ./...
          go vet ./transport/grpc ./transport/tls ./protocol/vless ./dialer/v2ray
          test "$(git diff --name-only)" = "$(printf '%s\n' \
            dialer/v2ray/v2ray.go \
            dialer/v2ray/v2ray_test.go \
            pkg/jp3diag/jp3diag.go \
            protocol/vless/conn.go \
            transport/grpc/grpc_client.go \
            transport/grpc/grpc_client_test.go \
            transport/tls/reality.go \
            transport/tls/reality_test.go)"

      - name: Point dae at local fixed outbound
        shell: bash
        working-directory: source/dae
        run: |
          set -euo pipefail
          go mod edit -replace=github.com/daeuniverse/outbound="$GITHUB_WORKSPACE/source/outbound"
          grep -Fqx "replace github.com/daeuniverse/outbound => $GITHUB_WORKSPACE/source/outbound" go.mod
          grep -Fqx $'\tgithub.com/daeuniverse/outbound '"$OUTBOUND_REQUIRED_VERSION" go.mod
          test "$(git diff --name-only)" = "go.mod"
          git diff --check
          git diff -- go.mod
          git diff -- go.mod > "$RUNNER_TEMP/expected-dae-go-mod.patch"

      - name: Download locked dependencies
        shell: bash
        working-directory: source/dae
        run: |
          set -euo pipefail
          export GOMODCACHE="$PWD/go-mod"
          export GOFLAGS="-mod=readonly -modcacherw"
          go mod download
          test "$(git diff --name-only)" = "go.mod"

      - name: Build ARM64 binary with official Makefile
        shell: bash
        working-directory: source/dae
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          export GOOS=linux
          export GOARCH=arm64
          export CGO_ENABLED=0
          export GOMODCACHE="$PWD/go-mod"
          export GOFLAGS="-trimpath -mod=readonly -modcacherw"
          export GOEXPERIMENT="newinliner,simd,heapminimum512kib,randomizedheapbase64"
          export OUTPUT="$GITHUB_WORKSPACE/dist/$BINARY_NAME"
          export VERSION="$BUILD_VERSION"
          export CLANG=clang-15
          export STRIP=llvm-strip-15
          make CC=clang

          diff -u "$RUNNER_TEMP/expected-dae-go-mod.patch" <(git diff -- go.mod)
          test "$(git diff --name-only)" = "go.mod"
          scripts="$GITHUB_WORKSPACE/scripts/verify-reality-version.sh"
          "$scripts" ../outbound/transport/tls/reality.go 26 3 27
          diff -u "$GITHUB_WORKSPACE/patches/jp3-reality-grpc-handoff-probe-6.patch" \
            <(git -C ../outbound diff --unified=0 --binary)

      - name: Verify ARM64 artifact and provenance
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/$BINARY_NAME"
          file "$binary" | tee "$RUNNER_TEMP/file.txt"
          grep -Eq 'ELF 64-bit.*ARM aarch64' "$RUNNER_TEMP/file.txt"
          ls -lh "$binary"
          sha256sum "$binary"
          go version -m "$binary" | tee "$RUNNER_TEMP/go-version-m.txt"
          grep -F "github.com/daeuniverse/outbound" "$RUNNER_TEMP/go-version-m.txt"
          grep -F "$GITHUB_WORKSPACE/source/outbound" "$RUNNER_TEMP/go-version-m.txt"
          grep -F "vcs.revision=$DAE_COMMIT" "$RUNNER_TEMP/go-version-m.txt"

          echo "Fixed outbound checkout: $(git -C source/outbound rev-parse HEAD)"
          sha256sum source/outbound/transport/tls/reality.go patches/jp3-reality-grpc-handoff-probe-6.patch
          strings "$binary" > "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq "$BUILD_VERSION" "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq '[JP3DIAG][%s]' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'REALITY/uTLS via context dialer' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'handshake_success verified=true' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'wire_selfcheck=%t' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'public_pki_fallback' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'DAE_JP3_REALITY_PROBE_VERSION' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'allowed values are 1.8.1, 1.8.10, and 26.3.27' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'singbox_keyshare_filter' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'sing-box-v1.12.25' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'sing-box key-share probe requires X25519MLKEM768' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'alpn_observed verified=true' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'application_transport' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'clientconn_obtained' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'tun_stream_created' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'first_send_result' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'first_recv_result' "$RUNNER_TEMP/binary-strings.txt"
          grep -Fq 'response_header_ok' "$RUNNER_TEMP/binary-strings.txt"
          if grep -Fq 'REALITY: unexpected negotiated ALPN' "$RUNNER_TEMP/binary-strings.txt"; then
            echo "post-REALITY ALPN hard-fail string remains in binary" >&2
            exit 1
          fi
          if grep -Fq 'handshake_not_used' "$RUNNER_TEMP/binary-strings.txt"; then
            echo "stale handshake_not_used marker embedded" >&2
            exit 1
          fi
          echo "Embedded fix and diagnostic markers verified without printing binary strings."

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          cp patches/jp3-reality-grpc-handoff-probe-6.patch dist/
          (
            cd dist
            sha256sum "$BINARY_NAME" jp3-reality-grpc-handoff-probe-6.patch > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: dae-jp3-reality-grpc-handoff-probe-arm64
          path: |
            dist/dae-jp3-reality-grpc-handoff-probe-arm64
            dist/SHA256SUMS
            dist/jp3-reality-grpc-handoff-probe-6.patch
          retention-days: 14
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: dae JP3 REALITY gRPC handoff probe build
          prerelease: true
          generate_release_notes: false
          body: |
            Experimental, unofficial JP3-only REALITY-to-gRPC handoff build.
            Baselines: dae 5a51cc747ef9e17185d438dc54ebf32c681984db; olicesx/outbound 52c26f8e759e156d2f5ec97d18590febf74ba8bb.
            Reference: Xray REALITY and sing-box v1.12.25 return the authenticated connection after REALITY verification without enforcing negotiated ALPN inside the REALITY layer.
            Prior key-share probe established causality: removing X25519MLKEM768 changed JP3 from public-PKI fallback to a REALITY temporary certificate with matching HMAC and verified=true. That filter remains enabled.
            Probe 5 then showed that both [h2] and [h2, http/1.1] offers produce an empty negotiated ALPN after successful REALITY admission. This build keeps the probe-5 wire inputs unchanged and removes only the local post-REALITY ALPN hard failure.
            ALPN remains recorded honestly and is never forged. Once verified=true, the authenticated uTLS connection is handed to pre-secured grpc-go without a second TLS layer. Actual gRPC send/receive results and VLESS response_header_ok determine readiness; creating ClientConn or NewStream does not.
            Run with DAE_JP3_REALITY_PROBE_VERSION=1.8.1. REALITY version, MLKEM removal, X25519 authentication, ALPN offer [h2, http/1.1], refraction-networking/utls v1.8.2, fingerprint, SNI, public key, shortId, gRPC, VLESS, timeout, retry, DNS, routing, health checks, serviceName, and path remain unchanged.
            Diagnostics report structural and protocol milestones only; no authentication values are logged.
          files: |
            dist/dae-jp3-reality-grpc-handoff-probe-arm64
            dist/SHA256SUMS
            dist/jp3-reality-grpc-handoff-probe-6.patch
          fail_on_unmatched_files: true
